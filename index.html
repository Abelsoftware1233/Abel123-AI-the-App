<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Abel AI — Full Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

  <!-- HEADER -->
  <header class="hud">
    <div class="hud-left">
      <div class="core" id="core">
        <span class="core-ring r1"></span>
        <span class="core-ring r2"></span>
        <span class="core-dot"></span>
      </div>
      <div>
        <h1>ABEL123 <span class="highlight">AI</span></h1>
        <p class="status" id="statusText" data-i18n="connected">● Connected</p>
        <div class="model-badge">
          <span class="dot"></span>
          <span>Model GPU 8.8</span>
        </div>
        <p class="status" id="tokenBudget" style="font-size:0.75rem; opacity:0.85; margin-top:8px;"></p>
        <div class="token-bar-track">
          <div class="token-bar-fill" id="tokenBarFill" style="width:100%;"></div>
        </div>
      </div>
    </div>
    <div class="hud-right">
      <div class="lang-switcher">
        <button id="langBtn" class="lang-btn" title="Language / Idioma / Taal">EN</button>
        <div id="langMenu" class="lang-menu">
          <button class="lang-option" data-lang="en"><span>🇬🇧</span> English</button>
          <button class="lang-option" data-lang="es"><span>🇪🇸</span> Español</button>
          <button class="lang-option" data-lang="nl"><span>🇳🇱</span> Nederlands</button>
        </div>
      </div>
      <button id="settingsBtn" class="btn-ghost">⚙</button>
      <button id="clearBtn" class="btn-ghost">↺</button>
    </div>
  </header>

  <!-- SETTINGS PANEL -->
  <div id="settingsPanel" class="settings-panel" style="display:none;">
    <label for="apiBaseInput" data-i18n="backendUrlLabel">Backend URL (empty = local / localhost)</label>
    <input type="text" id="apiBaseInput" placeholder="https://your-server.com" data-i18n-placeholder="backendUrlPlaceholder">
    <button id="saveApiBaseBtn" class="btn-primary" data-i18n="save">Save</button>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" data-tab="chat">💬 <span data-i18n="chatTab">Chat</span></button>
    <button class="tab" data-tab="face">👤 <span data-i18n="faceTab">Face</span></button>
  </div>

  <!-- CHAT TAB -->
  <div id="chatTab" class="tab-content active">
    <div class="log" id="log">
      <div class="message system">
        <span class="time">00:00:00</span>
        <span class="badge sys">SYS</span>
        <span data-i18n="onlineMsg">Abel123 AI online. Ask a question.</span>
      </div>
    </div>
    <form class="input-area" id="chatForm">
      <input type="text" id="chatInput" data-i18n-placeholder="typeMessage" placeholder="Type a message..." autocomplete="off">
      <button type="submit" id="sendBtn">➤</button>
    </form>
  </div>

  <!-- FACE TAB -->
  <div id="faceTab" class="tab-content">
    <div class="face-area">
      <div class="image-preview" id="facePreview">
        <span class="placeholder" data-i18n="uploadPlaceholder">👤 Upload a face photo</span>
      </div>
      <div class="upload-area">
        <input type="file" id="faceUpload" accept="image/*" hidden>
        <button id="uploadBtn" class="btn-primary">📁 <span data-i18n="uploadPhoto">Upload photo</span></button>
        <button id="analyzeBtn" class="btn-secondary" disabled>🔍 <span data-i18n="analyze">Analyze</span></button>
      </div>
      <div class="analysis-result" id="analysisResult"></div>
    </div>
  </div>

</div>

<script>
  // ============================
  // TRANSLATIONS (EN / ES / NL)
  // ============================
  const I18N = {
    en: {
      connected: "● Connected",
      disconnected: "● Disconnected",
      backendUrlLabel: "Backend URL (empty = local / localhost)",
      backendUrlPlaceholder: "https://your-server.com",
      save: "Save",
      chatTab: "Chat",
      faceTab: "Face",
      onlineMsg: "Abel123 AI online. Ask a question.",
      typeMessage: "Type a message...",
      uploadPlaceholder: "👤 Upload a face photo",
      uploadPhoto: "Upload photo",
      analyze: "Analyze",
      thinking: "Thinking...",
      tokensLeft: "Tokens left",
      cleared: "Chat history cleared. Abel123 AI is ready.",
      errorPrefix: "Error: ",
      serverError: "Server error occurred",
      connectionError: "Error connecting to the server.",
      analyzing: "Analyzing image...",
      analysisFailed: "Analysis failed",
      visionConnectionError: "Error connecting to the server."
    },
    es: {
      connected: "● Conectado",
      disconnected: "● Desconectado",
      backendUrlLabel: "URL del backend (vacío = local / localhost)",
      backendUrlPlaceholder: "https://tu-servidor.com",
      save: "Guardar",
      chatTab: "Chat",
      faceTab: "Rostro",
      onlineMsg: "Abel123 AI en línea. Haz una pregunta.",
      typeMessage: "Escribe un mensaje...",
      uploadPlaceholder: "👤 Sube una foto de un rostro",
      uploadPhoto: "Subir foto",
      analyze: "Analizar",
      thinking: "Pensando...",
      tokensLeft: "Tokens restantes",
      cleared: "Historial de chat borrado. Abel123 AI está listo.",
      errorPrefix: "Error: ",
      serverError: "Ocurrió un error en el servidor",
      connectionError: "Error al conectar con el servidor.",
      analyzing: "Analizando imagen...",
      analysisFailed: "Error en el análisis",
      visionConnectionError: "Error al conectar con el servidor."
    },
    nl: {
      connected: "● Verbonden",
      disconnected: "● Niet verbonden",
      backendUrlLabel: "Backend-URL (leeg = lokaal / localhost)",
      backendUrlPlaceholder: "https://jouw-server.nl",
      save: "Opslaan",
      chatTab: "Chat",
      faceTab: "Gezicht",
      onlineMsg: "Abel123 AI online. Stel een vraag.",
      typeMessage: "Typ een bericht...",
      uploadPlaceholder: "👤 Upload een gezichtsfoto",
      uploadPhoto: "Upload foto",
      analyze: "Analyseer",
      thinking: "Aan het denken...",
      tokensLeft: "Tokens over",
      cleared: "Chatgeschiedenis gewist. Abel123 AI is gereed.",
      errorPrefix: "Fout: ",
      serverError: "Serverfout opgetreden",
      connectionError: "Fout bij verbinden met de server.",
      analyzing: "Afbeelding analyseren...",
      analysisFailed: "Analyse mislukt",
      visionConnectionError: "Fout bij verbinden met de server."
    }
  };

  // Detect saved language, default to English
  let currentLang = localStorage.getItem("appLang") || "en";
  if (!I18N[currentLang]) currentLang = "en";

  function t(key) {
    return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key;
  }

  function applyTranslations() {
    document.documentElement.lang = currentLang;

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      el.textContent = t(key);
    });

    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
      const key = el.getAttribute("data-i18n-placeholder");
      el.setAttribute("placeholder", t(key));
    });

    const langBtn = document.getElementById("langBtn");
    if (langBtn) langBtn.textContent = currentLang.toUpperCase();

    document.querySelectorAll(".lang-option").forEach(btn => {
      btn.classList.toggle("active", btn.getAttribute("data-lang") === currentLang);
    });
  }

  function setLanguage(lang) {
    if (!I18N[lang]) return;
    currentLang = lang;
    localStorage.setItem("appLang", lang);
    applyTranslations();
    const menu = document.getElementById("langMenu");
    if (menu) menu.classList.remove("open");
  }

  document.addEventListener("DOMContentLoaded", () => {
    applyTranslations();

    const langBtn = document.getElementById("langBtn");
    const langMenu = document.getElementById("langMenu");

    if (langBtn && langMenu) {
      langBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        langMenu.classList.toggle("open");
      });

      document.querySelectorAll(".lang-option").forEach(btn => {
        btn.addEventListener("click", () => {
          setLanguage(btn.getAttribute("data-lang"));
        });
      });

      document.addEventListener("click", () => {
        langMenu.classList.remove("open");
      });
    }
  });

  // Expose helper globally so script.js can use translated strings
  window.i18n = { t, get lang() { return currentLang; } };
</script>

<script src="script.js"></script>
</body>
</html>
